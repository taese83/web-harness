# Inactive canonical proposal — search-portal(퀸텟) T1 격리 검증 워크플로.
# 활성화 전제(플랫폼 승인 필요, 이 파일은 배치 전까지 실행되지 않는다):
#   1. 이 파일을 .github/workflows/search-portal-t1.yml 로 배치.
#   2. self-hosted 러너 프로비저닝(라벨: web-harness-isolated) — CI 환경 구성 책임으로
#      실제 격리를 증명한다: 소스 read-only 성격 유지(작업 사본만 쓰기), deny-by-default
#      egress에 registry.npmjs.org만 allowlist(pnpm install/audit용 — audit는 레지스트리
#      조회가 필수라 완전 오프라인 불가), Node 22.22.3·pnpm 11.18.0 사전 프로비전
#      (validate-toolchain이 검증), Playwright Chromium 사전 설치 + PLAYWRIGHT_BROWSERS_PATH
#      고정(아래 env — 앱 playwright.config.ts의 호스트 캐시 파생은 existsSync 가드라
#      CI에서 무시됨).
#   3. protected environment(search-portal-t1-audit) 생성.
#   4. **선행 자원 결정**: workspace/search-portal은 하니스 repo에서 gitignore된 독립
#      release root다(계약). T1 실행에는 앱 소스의 정본 원격이 필요하다 —
#      (a) 전용 repo로 승격(권장: `node .claude/scripts/run-package-operation.mjs
#          --project workspace/search-portal --operation git-init` 후 원격 push), 또는
#      (b) 러너 로컬 경로 마운트(재현성 약함 — 비권장).
#      아래 checkout 단계의 `APP_REPO` placeholder를 (a)의 원격으로 치환한다.
#
# 발급물: WEB_HARNESS_ISOLATED_EXECUTION=1 단일 --all cohort receipt.
# 이 receipt가 ①현재 fingerprint 일치 ②24h 신선 ③필수 QA 전체 PASS와 결합되면
# release-tier-contract의 T1(ISOLATED_VERIFIED) 요건을 충족한다 — env var는 격리의
# "선언"이지 증명이 아니며, 증명 책임은 위 2번 러너 정책에 있다(라벨 한정 문구 유지).
name: search-portal-t1
on:
  workflow_dispatch:
    inputs:
      app_revision:
        description: 'search-portal repo의 검증 대상 revision(sha)'
        required: true
permissions:
  contents: read
concurrency:
  group: search-portal-t1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-search-portal:
    runs-on:
      - self-hosted
      - linux
      - x64
      - web-harness-isolated
    environment: search-portal-t1-audit
    timeout-minutes: 60
    env:
      CI: '1'
      WEB_HARNESS_ISOLATED_EXECUTION: '1'
      # 러너에 사전 설치된 브라우저 저장소 — 앱 e2e(playwright.config.ts)가 그대로 사용.
      PLAYWRIGHT_BROWSERS_PATH: /opt/web-harness/ms-playwright
    steps:
      - name: Checkout harness control plane without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout search-portal at the exact requested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: APP_REPO # 자원 결정 (a) 후 치환 — 예: <org>/quintet-search-portal
          ref: ${{ inputs.app_revision }}
          path: workspace/search-portal
          persist-credentials: false
          fetch-depth: 1
      - name: Verify preprovisioned Node and pnpm toolchain
        run: node .claude/scripts/validate-toolchain.mjs
      - name: Verify isolated runner browser contract
        run: test -d "$PLAYWRIGHT_BROWSERS_PATH" && ls "$PLAYWRIGHT_BROWSERS_PATH" | grep -q chromium
      - name: Validate control plane before project execution
        run: pnpm run ci
      # Phase 4 계약: 구현이 끝난 project를 같은 deployment/capabilities로 다시 resolve하고
      # execution plan을 재컴파일한다. framework/toolchain 선언·adapter hash·plan graph가
      # 달라지면 여기서 non-zero로 멈춘다(quality runner 이전 BLOCKED). stdout JSON을 그대로
      # 기록하며 오류 JSON·non-zero를 성공으로 변환하지 않는다(web-profile-contract).
      - name: Re-resolve profile and recompile execution plan
        run: |
          set -euo pipefail
          # 인자는 잠금된 project-profile.json의 실측값이다(로컬 재현 확인: resolver exit 0,
          # compile 12노드 plan). deployment target은 static-cdn이 아니라 vercel-hybrid다.
          node .claude/scripts/web-core/resolve-profile.mjs \
            --project-root workspace/search-portal \
            --requested vite-serverless-hybrid --provider vercel --deployment vercel-hybrid \
            --capability client-routing --capability csr \
            --capability serverless-functions --capability static-build \
            > workspace/search-portal/_workspace/01_plan/project-profile.json
          # --profile-file은 project root 내부 경로여야 한다(PROFILE_PATH_OUTSIDE_PROJECT).
          node .claude/scripts/web-core/compile-execution-plan.mjs \
            --profile-file workspace/search-portal/_workspace/01_plan/project-profile.json \
            > workspace/search-portal/_workspace/03_dev/web-execution-plan.json
      - name: Install reviewed frozen dependency graph
        run: node .claude/scripts/run-package-operation.mjs --project workspace/search-portal --operation install
      - name: Run one isolated full quality cohort
        run: node .claude/scripts/run-quality-gates.mjs --project workspace/search-portal --all
      - name: Upload bounded T1 evidence
        if: always()
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: search-portal-t1-${{ github.run_id }}
          path: |
            workspace/search-portal/_workspace/01_plan/project-profile.json
            workspace/search-portal/_workspace/03_dev/web-execution-plan.json
            workspace/search-portal/_workspace/04_qa/evidence
            workspace/search-portal/_workspace/04_qa/qa-*.md
            workspace/search-portal/_workspace/RELEASE/release-readiness.md
            workspace/search-portal/package.json
            workspace/search-portal/pnpm-lock.yaml
